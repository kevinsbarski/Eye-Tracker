<!doctype html>
<meta charset="utf-8">
<title>Eye Tracker demo animation</title>
<style>
  html, body { margin: 0; background: #0b0f17; }
  canvas { display: block; width: 960px; height: 560px; }
</style>
<canvas id="c"></canvas>
<script>
// The README demo animation. Open this file in a browser to watch it loop,
// or run render.cjs to turn it into demo.gif and demo.mp4.
// Everything is drawn by draw(t), where t is seconds since the start.

const W = 960, H = 560, DURATION = 17.5;
const params = new URLSearchParams(location.search);
const SCALE = Number(params.get('scale')) || 2;
const cv = document.getElementById('c');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx = cv.getContext('2d');

const FONT = '-apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
const COL = {
  bg: '#0b0f17', panel: '#111827', line: '#263043', text: '#e8eef6', dim: '#8b98ab',
  accent: '#4cc2ff', green: '#3ddc84', gaze: '#ff6b6b',
  headFill: '#22304a', headLine: '#8fa6c2', hair: '#3a4d6e',
};

// ---------- small helpers ----------
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- the story ----------
// Where the person looks over time: -1 left monitor, 0 MacBook, +1 right monitor.
const GAZE_KEYS = [
  [0, -1], [0.35, -1], [0.95, 1], [3.7, 1], [4.4, 0], [7.2, 0], [8.0, -1],
  [10.4, -1], [11.4, 1], [13.8, 1], [14.5, 0], [DURATION, 0],
];
function gazeAt(t) {
  if (t <= GAZE_KEYS[0][0]) return GAZE_KEYS[0][1];
  for (let i = 1; i < GAZE_KEYS.length; i++) {
    const [t1, v1] = GAZE_KEYS[i], [t0, v0] = GAZE_KEYS[i - 1];
    if (t <= t1) return lerp(v0, v1, ease(seg(t, t0, t1)));
  }
  return GAZE_KEYS[GAZE_KEYS.length - 1][1];
}
const regionOf = g => (g < -0.5 ? 'L' : g > 0.5 ? 'R' : 'C');

const MANUAL_START = 0.7, MANUAL_END = 2.9;   // the cursor is dragged by hand
const CAMERA_ON = 3.5, TRACK_ON = 5.0;        // then the app takes over
const DWELL = 0.45;                           // shown slightly slower than the real 0.3 s

// Play the switching rule forward once, so focus changes exactly when a dwell completes.
const SIM_HZ = 120;
const sim = { focus: [], progress: [], changes: [{ t: -10, from: null, to: 'L' }] };
(function simulate() {
  let focus = 'L', look = null, enter = 0;
  for (let i = 0; i <= DURATION * SIM_HZ; i++) {
    const t = i / SIM_HZ;
    let progress = 0;
    if (t < TRACK_ON) {
      if (focus === 'L' && t >= MANUAL_END) {
        focus = 'R'; sim.changes.push({ t, from: 'L', to: 'R', manual: true });
      }
    } else {
      const now = regionOf(gazeAt(t));
      if (now !== look) { look = now; enter = t; }
      progress = look === focus ? 1 : clamp01((t - enter) / DWELL);
      if (progress >= 1 && look !== focus) {
        sim.changes.push({ t, from: focus, to: look });
        focus = look;
      }
    }
    sim.focus.push(focus); sim.progress.push(progress);
  }
})();
const simIndex = t => Math.max(0, Math.min(sim.focus.length - 1, Math.round(t * SIM_HZ)));
function lastChange(t) {
  let c = sim.changes[0];
  for (const ch of sim.changes) if (ch.t <= t) c = ch;
  return c;
}
function focusAmount(s, t) {
  const c = lastChange(t), u = ease(seg(t, c.t, c.t + 0.22));
  return c.to === s ? u : c.from === s ? 1 - u : 0;
}

// ---------- layout ----------
const SCR = {
  L: { x: 70, y: 62, w: 270, h: 166, kind: 'code', name: 'Left monitor' },
  C: { x: 390, y: 124, w: 180, h: 116, kind: 'terminal', name: 'MacBook', laptop: true },
  R: { x: 620, y: 62, w: 270, h: 166, kind: 'browser', name: 'Right monitor' },
};
const CURSOR = { L: [236, 172], C: [498, 204], R: [792, 160] };  // where it was left on each screen
const TARGET = { L: [205, 138], C: [480, 180], R: [755, 138] };  // where the eyes land
const PANEL = { x: 372, y: 300, w: 216, h: 216 };

function gazePoint(g) {
  const [a, b, u] = g < 0 ? [TARGET.L, TARGET.C, g + 1] : [TARGET.C, TARGET.R, g];
  return [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
}

// ---------- screens ----------
function drawWindow(r, kind, f, t) {
  const light = kind === 'browser';
  ctx.save();
  rr(r.x, r.y, r.w, r.h, 5); ctx.clip();
  ctx.fillStyle = light ? '#f1f4f9' : '#0e1522'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = light ? '#dbe2ec' : '#1c2637'; ctx.fillRect(r.x, r.y, r.w, 14);
  const lights = ['#ff5f57', '#febc2e', '#28c840'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = f > 0.5 ? lights[i] : (light ? '#b9c2cf' : '#3a465a');
    ctx.beginPath(); ctx.arc(r.x + 9 + i * 8, r.y + 7, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  const blink = f > 0.6 && Math.floor(t * 2.4) % 2 === 0;
  const bar = (x, y, w, c, h = 4) => { ctx.fillStyle = c; rr(x, y, w, h, 2); ctx.fill(); };
  const rows = Math.floor((r.h - 26) / 10);
  if (kind === 'code') {
    const L = [[0, 54, '#c792ea'], [10, 92, '#82aaff'], [10, 70, '#7f8ba0'], [20, 110, '#c3e88d'],
      [20, 64, '#82aaff'], [10, 40, '#7f8ba0'], [0, 30, '#c792ea'], [0, 0, ''], [0, 66, '#c792ea'],
      [10, 120, '#82aaff'], [10, 84, '#c3e88d'], [10, 48, '#7f8ba0']];
    let end = [r.x + 12, r.y + 22];
    for (let i = 0; i < Math.min(rows, L.length); i++) {
      const [ind, w, c] = L[i]; if (!w) continue;
      const y = r.y + 22 + i * 10;
      bar(r.x + 12 + ind, y, w, c); end = [r.x + 12 + ind + w + 4, y];
    }
    if (blink) { ctx.fillStyle = COL.accent; ctx.fillRect(end[0], end[1] - 3, 1.6, 9); }
  } else if (kind === 'terminal') {
    const L = [64, 96, 0, 48, 110, 80, 0, 30];
    let end = [0, 0];
    for (let i = 0; i < Math.min(rows, L.length); i++) {
      const y = r.y + 22 + i * 10;
      if (L[i] === 0) continue;
      const prompt = i === 0 || i === 3 || i === 7;
      if (prompt) bar(r.x + 10, y, 5, COL.green);
      bar(r.x + (prompt ? 20 : 10), y, L[i], prompt ? '#cfd8e6' : '#6f7c92');
      end = [r.x + (prompt ? 20 : 10) + L[i] + 4, y];
    }
    if (blink) { ctx.fillStyle = COL.green; ctx.fillRect(end[0], end[1] - 3, 5, 9); }
  } else {
    rr(r.x + 40, r.y + 3, r.w - 60, 8, 4); ctx.fillStyle = '#ffffff'; ctx.fill();
    if (blink) { ctx.fillStyle = '#2563eb'; ctx.fillRect(r.x + 82, r.y + 4, 1.4, 6); }
    bar(r.x + 46, r.y + 5.5, 32, '#9aa7b8', 3);
    const g = ctx.createLinearGradient(r.x, r.y, r.x + 90, r.y + 90);
    g.addColorStop(0, '#7aa2ff'); g.addColorStop(1, '#c084fc');
    ctx.fillStyle = g; rr(r.x + 12, r.y + 24, 82, r.h - 36, 4); ctx.fill();
    const T = [96, 80, 0, 104, 92, 100, 60, 0, 88, 70];
    for (let i = 0; i < Math.min(rows, T.length); i++) {
      if (T[i]) bar(r.x + 106, r.y + 26 + i * 10, T[i], i < 2 ? '#334155' : '#a3afc0', i < 2 ? 5 : 4);
    }
  }
  ctx.fillStyle = rgba('#080b12', 0.5 * (1 - f)); ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();
  rr(r.x, r.y, r.w, r.h, 5);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = f > 0.02 ? rgba(COL.accent, 0.25 + 0.75 * f) : 'rgba(255,255,255,0.10)';
  ctx.stroke();
}

function drawScreen(id, t) {
  const s = SCR[id], f = focusAmount(id, t), cx = s.x + s.w / 2;
  const c = lastChange(t);
  const pulse = c.to === id ? 1 - seg(t, c.t, c.t + 0.6) : 0;
  ctx.save();
  // stand or base
  ctx.fillStyle = '#1a2231';
  if (s.laptop) {
    rr(s.x - 26, s.y + s.h + 5, s.w + 52, 9, [2, 2, 9, 9]); ctx.fill();
    ctx.fillStyle = '#0d121b'; rr(cx - 16, s.y + s.h + 5, 32, 3, [0, 0, 3, 3]); ctx.fill();
  } else {
    ctx.fillRect(cx - 9, s.y + s.h + 5, 18, 21);
    rr(cx - 50, s.y + s.h + 25, 100, 6, 3); ctx.fill();
  }
  // bezel, glowing when focused
  const top = s.laptop ? 7 : 5;
  if (f > 0.02) { ctx.shadowColor = rgba(COL.accent, 0.55 * f + 0.4 * pulse); ctx.shadowBlur = 22 + 26 * pulse; }
  rr(s.x - 5, s.y - top, s.w + 10, s.h + top + 5, 8);
  ctx.fillStyle = '#1a2231'; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(COL.accent, 0.9 * f); if (f > 0.02) ctx.stroke();
  // wallpaper
  const wp = { L: ['#17223b', '#27406a'], C: ['#221a3c', '#40306a'], R: ['#12302f', '#1f5148'] }[id];
  const g = ctx.createLinearGradient(s.x, s.y, s.x + s.w, s.y + s.h);
  g.addColorStop(0, wp[0]); g.addColorStop(1, wp[1]);
  rr(s.x, s.y, s.w, s.h, 3); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = rgba('#080b12', 0.38 * (1 - f)); ctx.fill();
  // the MacBook camera and its green light
  if (s.laptop) {
    const on = seg(t, CAMERA_ON, CAMERA_ON + 0.3);
    ctx.fillStyle = '#05070b'; ctx.beginPath(); ctx.arc(cx, s.y - 3.5, 1.9, 0, 7); ctx.fill();
    if (on > 0) {
      ctx.shadowColor = COL.green; ctx.shadowBlur = 8;
      ctx.fillStyle = rgba(COL.green, on); ctx.beginPath(); ctx.arc(cx + 7, s.y - 3.5, 1.5, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
  const m = s.laptop ? [12, 11, 24, 24] : [22, 17, 44, 36];
  drawWindow({ x: s.x + m[0], y: s.y + m[1], w: s.w - m[2], h: s.h - m[3] }, s.kind, f, t);
}

// ---------- cursor ----------
function drawArrow(x, y, alpha, ghost) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(1.15, 1.15); ctx.globalAlpha = alpha;
  ctx.beginPath();
  [[0, 0], [0, 16], [4.4, 12.4], [7.4, 19], [10, 17.9], [7.1, 11.5], [12.6, 11.5]]
    .forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
  ctx.closePath(); ctx.lineJoin = 'round';
  if (ghost) {
    ctx.setLineDash([2.5, 2]); ctx.lineWidth = 1.2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  } else {
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 1.5;
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.3; ctx.strokeStyle = '#0b0f17'; ctx.stroke();
  }
  ctx.restore();
}
function manualPos(t) {
  // An uneven hand drag from the left monitor to the right one, by way of the MacBook.
  const u = seg(t, MANUAL_START, MANUAL_END);
  const k = 0.5 * ease(u) + 0.5 * u;
  return [
    lerp(CURSOR.L[0], CURSOR.R[0], k) + Math.sin(u * 19) * 3 * Math.sin(Math.PI * u),
    lerp(CURSOR.L[1], CURSOR.R[1], k) + Math.sin(Math.PI * k) * 42 + Math.sin(u * 13) * 4 * Math.sin(Math.PI * u),
  ];
}
function drawCursors(t) {
  const trk = ease(seg(t, TRACK_ON - 0.4, TRACK_ON));
  if (t < MANUAL_END + 0.6) {
    // the trail of the manual drag
    const fade = 1 - seg(t, MANUAL_END, MANUAL_END + 0.6);
    ctx.save(); ctx.setLineDash([3, 5]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = rgba('#ffffff', 0.45 * fade); ctx.beginPath();
    for (let s = MANUAL_START; s <= Math.min(t, MANUAL_END); s += 0.02) {
      const [x, y] = manualPos(s); s === MANUAL_START ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
  if (t < MANUAL_END) { drawArrow(...manualPos(t), 1, false); return; }
  const focus = sim.focus[simIndex(t)], c = lastChange(t);
  for (const id of ['L', 'C', 'R']) if (id !== focus) drawArrow(...CURSOR[id], 0.5 * trk, true);
  const [x, y] = CURSOR[focus];
  if (!c.manual) {
    const p = seg(t, c.t, c.t + 0.55);
    if (p < 1) {
      ctx.strokeStyle = rgba(COL.accent, 1 - p); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + 5, y + 8, 6 + 30 * ease(p), 0, 7); ctx.stroke();
    }
  }
  drawArrow(x, y, 1, false);
}

// ---------- gaze dot ----------
function drawGaze(t) {
  const a = ease(seg(t, TRACK_ON - 0.3, TRACK_ON + 0.1));
  if (a <= 0) return;
  const [x, y] = gazePoint(gazeAt(t));
  const prog = sim.progress[simIndex(t)];
  ctx.save();
  ctx.setLineDash([2, 6]); ctx.lineWidth = 1.4; ctx.strokeStyle = rgba(COL.gaze, 0.5 * a);
  ctx.beginPath(); ctx.moveTo(PANEL.x + PANEL.w / 2, PANEL.y - 4); ctx.lineTo(x, y + 12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = rgba(COL.gaze, 0.2 * a); ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(COL.gaze, a); ctx.beginPath(); ctx.arc(x, y, 4.2, 0, 7); ctx.fill();
  if (prog > 0 && prog < 1) {
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = rgba('#ffffff', 0.95 * a);
    ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

// ---------- the face in the camera view ----------
const HEAD = { rx: 54, ry: 70, rz: 58 };
const hairline = x => -46 + 36 * (x / HEAD.rx) ** 2;
const surfaceZ = (x, y) => HEAD.rz * Math.sqrt(Math.max(0, 1 - (x / HEAD.rx) ** 2 - (y / HEAD.ry) ** 2));
const MESH = (() => {
  const step = 10.5, pts = new Map();
  for (let j = -6; j <= 6; j++) for (let i = -5; i <= 5; i++) {
    const x = i * step, y = j * step + 4;
    if ((x / HEAD.rx) ** 2 + (y / HEAD.ry) ** 2 < 0.87 && y > hairline(x) + 2) pts.set(`${i},${j}`, [x, y, i, j]);
  }
  const edges = [];
  for (const [, [, , i, j]] of pts) for (const [di, dj] of [[1, 0], [0, 1], [1, 1]]) {
    if (pts.has(`${i + di},${j + dj}`)) edges.push([`${i},${j}`, `${i + di},${j + dj}`]);
  }
  return { pts, edges };
})();

function drawFace(t) {
  const P = PANEL, cx = P.x + P.w / 2, cy = P.y + 96;
  const head = gazeAt(t - 0.1), eyes = gazeAt(t + 0.07);
  const yaw = head * 25 * Math.PI / 180, pitch = Math.abs(head) * 5 * Math.PI / 180;
  const sy = Math.sin(yaw), cyw = Math.cos(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch);
  const proj = (x, y, z) => {
    const x1 = x * cyw + z * sy, z1 = -x * sy + z * cyw;
    return [cx + x1, cy + y * cp - z1 * sp, y * sp + z1 * cp];
  };
  const on = (x, y, lift = 0) => proj(x, y, surfaceZ(x, y) + lift);
  const cam = seg(t, CAMERA_ON, CAMERA_ON + 0.3);
  const trk = ease(seg(t, TRACK_ON - 0.4, TRACK_ON));

  ctx.save();
  rr(P.x, P.y, P.w, P.h, 16); ctx.fillStyle = COL.panel; ctx.fill();
  ctx.save(); ctx.clip();
  const bgG = ctx.createRadialGradient(cx, cy, 20, cx, cy, 170);
  bgG.addColorStop(0, '#1a2436'); bgG.addColorStop(1, '#0e1420');
  ctx.fillStyle = bgG; ctx.fillRect(P.x, P.y, P.w, P.h);

  // shoulders and neck
  ctx.fillStyle = '#1b2740'; ctx.strokeStyle = COL.headLine; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx - 100, P.y + P.h + 4);
  ctx.bezierCurveTo(cx - 96, cy + 92, cx - 40, cy + 96, cx - 19, cy + 78);
  ctx.lineTo(cx - 19, cy + 50); ctx.lineTo(cx + 19, cy + 50); ctx.lineTo(cx + 19, cy + 78);
  ctx.bezierCurveTo(cx + 40, cy + 96, cx + 96, cy + 92, cx + 100, P.y + P.h + 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // ears, then the head over them
  ctx.fillStyle = COL.headFill;
  for (const side of [-1, 1]) {
    const [ex, ey] = proj(side * HEAD.rx, 2, -6);
    ctx.beginPath(); ctx.ellipse(ex, ey, 7, 12, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(cx, cy, HEAD.rx + 1, HEAD.ry, 0, 0, 7); ctx.fill(); ctx.stroke();

  // hair: the top of the head down to a hairline that turns with the head
  ctx.beginPath(); ctx.ellipse(cx, cy - 2, HEAD.rx + 4, HEAD.ry + 4, 0, Math.PI, Math.PI * 2);
  for (let u = 1; u >= -1.001; u -= 0.1) {
    const y = -46 + 36 * u * u, x = u * HEAD.rx * Math.sqrt(1 - (y / HEAD.ry) ** 2) * 0.995;
    let [px, py, pz] = on(x, y);
    if (pz < 0) px = cx + Math.sign(px - cx) * (HEAD.rx + 1) * Math.sqrt(1 - ((py - cy) / HEAD.ry) ** 2);
    ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fillStyle = COL.hair; ctx.fill(); ctx.stroke();

  // brows, nose, mouth
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.4; ctx.strokeStyle = '#b9c9dd';
  for (const side of [-1, 1]) {
    const a = on(side * 11, -20), b = on(side * 22, -23), c = on(side * 32, -19);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(b[0], b[1], c[0], c[1]); ctx.stroke();
  }
  ctx.lineWidth = 1.8; ctx.strokeStyle = COL.headLine;
  const n0 = on(0, -6), n1 = on(0, 13, 12), n2 = on(0, 20), nl = on(-7, 19), nr = on(7, 19);
  ctx.beginPath(); ctx.moveTo(n0[0], n0[1]); ctx.lineTo(n1[0], n1[1]); ctx.lineTo(n2[0], n2[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nl[0], nl[1]); ctx.quadraticCurveTo(n2[0], n2[1] + 4, nr[0], nr[1]); ctx.stroke();
  const m0 = on(-14, 37), m1 = on(0, 42), m2 = on(14, 37);
  ctx.lineWidth = 2.2; ctx.strokeStyle = '#b9c9dd';
  ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.quadraticCurveTo(m1[0], m1[1], m2[0], m2[1]); ctx.stroke();

  // eyes: the irises move first and further than the head does
  const lead = Math.max(-1, Math.min(1, (eyes - head) * 1.6 + head * 0.35));
  const irises = [];
  for (const side of [-1, 1]) {
    const c = on(side * 21, -7), a = on(side * 21 - 10.5, -7), b = on(side * 21 + 10.5, -7);
    const hw = Math.abs(b[0] - a[0]) / 2, ex = (a[0] + b[0]) / 2;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(ex, c[1], hw, 6.2, 0, 0, 7);
    ctx.fillStyle = '#eef4fb'; ctx.fill(); ctx.clip();
    const ix = ex + lead * hw * 0.5, iy = c[1] - Math.abs(head) * 1.2;
    ctx.fillStyle = '#35507a'; ctx.beginPath(); ctx.arc(ix, iy, 5.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#0b0f17'; ctx.beginPath(); ctx.arc(ix, iy, 2.3, 0, 7); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 1.3; ctx.strokeStyle = COL.headLine;
    ctx.beginPath(); ctx.ellipse(ex, c[1], hw, 6.2, 0, 0, 7); ctx.stroke();
    irises.push([ix, iy, ex, c[1], hw]);
  }

  // the face points, revealed by a scan line when the camera turns on
  const scan = seg(t, CAMERA_ON + 0.4, CAMERA_ON + 1.3);
  if (scan > 0) {
    const cut = lerp(-70, 80, scan);
    const shown = (x, y) => clamp01((cut - y) / 14);
    const pp = new Map();
    for (const [k, [x, y]] of MESH.pts) pp.set(k, [...on(x, y), shown(x, y)]);
    ctx.lineWidth = 0.7;
    for (const [a, b] of MESH.edges) {
      const p = pp.get(a), q = pp.get(b), al = Math.min(p[3], q[3]);
      if (al <= 0 || p[2] < 6 || q[2] < 6) continue;
      ctx.strokeStyle = rgba(COL.green, 0.28 * al);
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
    for (const [, p] of pp) {
      if (p[3] <= 0 || p[2] < 4) continue;
      ctx.fillStyle = rgba(COL.green, 0.9 * p[3]);
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.25, 0, 7); ctx.fill();
    }
    const eyeAlpha = shown(0, -7);
    for (const [ix, iy, ex, ey, hw] of irises) {
      for (let k = 0; k < 8; k++) {
        const an = k * Math.PI / 4;
        ctx.fillStyle = rgba(COL.green, eyeAlpha);
        ctx.beginPath(); ctx.arc(ex + Math.cos(an) * hw, ey + Math.sin(an) * 6.2, 1.2, 0, 7); ctx.fill();
      }
      ctx.strokeStyle = rgba(COL.accent, eyeAlpha); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(ix, iy, 5.8, 0, 7); ctx.stroke();
      ctx.fillStyle = rgba(COL.accent, eyeAlpha);
      ctx.beginPath(); ctx.arc(ix, iy, 1.3, 0, 7); ctx.fill();
    }
    if (scan < 1) {
      const yl = cy + cut;
      const lg = ctx.createLinearGradient(0, yl - 16, 0, yl);
      lg.addColorStop(0, rgba(COL.green, 0)); lg.addColorStop(1, rgba(COL.green, 0.35));
      ctx.fillStyle = lg; ctx.fillRect(P.x, yl - 16, P.w, 16);
      ctx.fillStyle = rgba(COL.green, 0.9); ctx.fillRect(P.x, yl, P.w, 1.2);
    }
  }
  ctx.restore();   // end clip

  // frame and label
  rr(P.x, P.y, P.w, P.h, 16); ctx.lineWidth = 1.5;
  ctx.strokeStyle = cam > 0 ? rgba(COL.green, 0.25 + 0.45 * cam) : COL.line; ctx.stroke();
  ctx.font = `600 10.5px ${FONT}`; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0.8px';
  const label = cam > 0.5 ? 'MACBOOK CAMERA' : 'YOU';
  const tw = ctx.measureText(label).width + (cam > 0.5 ? 30 : 18);
  rr(P.x + 10, P.y + 10, tw, 20, 10); ctx.fillStyle = 'rgba(8,11,18,0.72)'; ctx.fill();
  if (cam > 0.5) {
    ctx.fillStyle = COL.green; ctx.beginPath(); ctx.arc(P.x + 21, P.y + 20, 3, 0, 7); ctx.fill();
  }
  ctx.fillStyle = COL.text; ctx.fillText(label, P.x + (cam > 0.5 ? 30 : 19), P.y + 20.5);
  ctx.letterSpacing = '0px';
  ctx.restore();
  return { head, eyeLead: lead, trk };
}

// ---------- text ----------
function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const word of text.split(' ')) {
    const tryLine = line ? line + ' ' + word : word;
    if (ctx.measureText(tryLine).width > maxW && line) { lines.push(line); line = word; } else line = tryLine;
  }
  if (line) lines.push(line);
  return lines;
}
const CAPTIONS = [
  [0, 3.5, 'THE PROBLEM', 'Your eyes switch screens instantly. Your cursor doesn’t.',
    'Every switch means dragging the mouse across the desk.'],
  [3.5, 7.2, 'HOW IT WORKS · 1 OF 3', 'The webcam finds 478 points on your face.',
    'Both irises included. Nothing leaves your Mac.'],
  [7.2, 10.4, 'HOW IT WORKS · 2 OF 3', 'Head and eye direction show which screen you’re looking at.',
    'A short calibration teaches it your desk.'],
  [10.4, 13.8, 'HOW IT WORKS · 3 OF 3', 'Hold your gaze for 0.3 s and the cursor and keyboard focus jump there.',
    'Quick glances along the way are ignored.'],
  [13.8, DURATION + 1, 'EYE TRACKER', 'Look at a screen. It’s focused.',
    'No clicking, no reaching for the mouse. Runs entirely on your Mac.'],
];
function drawCaptions(t) {
  const x = 64, maxW = 280;
  for (const [t0, t1, label, headline, sub] of CAPTIONS) {
    if (t < t0 || t > t1) continue;
    const a = Math.min(ease(seg(t, t0, t0 + 0.35)), 1 - ease(seg(t, t1 - 0.25, t1)));
    const dy = (1 - ease(seg(t, t0, t0 + 0.35))) * 8;
    ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'alphabetic';
    let y = 334 + dy;
    ctx.font = `700 11px ${FONT}`; ctx.letterSpacing = '1.4px'; ctx.fillStyle = COL.accent;
    ctx.fillText(label, x, y); ctx.letterSpacing = '0px';
    y += 32; ctx.font = `650 22px ${FONT}`; ctx.fillStyle = COL.text;
    for (const line of wrap(headline, maxW)) { ctx.fillText(line, x, y); y += 28; }
    y += 2; ctx.font = `400 14px ${FONT}`; ctx.fillStyle = COL.dim;
    for (const line of wrap(sub, maxW)) { ctx.fillText(line, x, y); y += 20; }
    ctx.restore();
  }
}

function drawReadout(t, face) {
  const x = 620, w = 270, a = 0.3 + 0.7 * face.trk;
  ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'alphabetic';
  const meter = (y, label, v) => {
    ctx.font = `700 11.5px ${FONT}`; ctx.letterSpacing = '1.2px'; ctx.fillStyle = COL.dim;
    ctx.fillText(label, x, y); ctx.letterSpacing = '0px';
    const by = y + 14;
    rr(x, by - 3, w, 6, 3); ctx.fillStyle = '#1a2231'; ctx.fill();
    ctx.fillStyle = '#3a465a'; ctx.fillRect(x + w / 2 - 0.75, by - 7, 1.5, 14);
    const px = x + w / 2 + v * (w / 2 - 8) * face.trk;
    rr(Math.min(px, x + w / 2), by - 3, Math.abs(px - (x + w / 2)), 6, 3); ctx.fillStyle = rgba(COL.accent, 0.45); ctx.fill();
    ctx.fillStyle = COL.accent; ctx.beginPath(); ctx.arc(px, by, 6, 0, 7); ctx.fill();
  };
  meter(334, 'HEAD DIRECTION', face.head);
  meter(384, 'EYE DIRECTION', face.eyeLead);
  ctx.font = `700 11.5px ${FONT}`; ctx.letterSpacing = '1.2px'; ctx.fillStyle = COL.dim;
  ctx.fillText('LOOKING AT', x, 438); ctx.letterSpacing = '0px';
  const tracking = t >= TRACK_ON - 0.2;
  const id = regionOf(gazeAt(t)), prog = tracking ? sim.progress[simIndex(t)] : 0;
  const focused = tracking && sim.focus[simIndex(t)] === id;
  ctx.font = `650 21px ${FONT}`; ctx.fillStyle = focused ? COL.accent : COL.text;
  ctx.fillText(tracking ? SCR[id].name : '—', x, 465);
  rr(x, 480, w, 6, 3); ctx.fillStyle = '#1a2231'; ctx.fill();
  if (prog > 0) { rr(x, 480, Math.max(6, w * prog), 6, 3); ctx.fillStyle = focused ? COL.accent : '#ffffff'; ctx.fill(); }
  ctx.font = `400 12.5px ${FONT}`; ctx.fillStyle = COL.dim;
  ctx.fillText(!tracking ? 'Camera off' : focused ? 'Cursor and keyboard focus are here' : 'Holding… switches after 0.3 s', x, 506);
  ctx.restore();
}

function drawHeader() {
  ctx.save(); ctx.textBaseline = 'middle';
  // a small eye mark
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 1.8; ctx.beginPath();
  ctx.moveTo(64, 32); ctx.quadraticCurveTo(75, 22, 86, 32); ctx.quadraticCurveTo(75, 42, 64, 32); ctx.stroke();
  ctx.fillStyle = COL.accent; ctx.beginPath(); ctx.arc(75, 32, 3.2, 0, 7); ctx.fill();
  ctx.font = `700 15px ${FONT}`; ctx.fillStyle = COL.text; ctx.fillText('Eye Tracker', 96, 32.5);
  ctx.font = `400 13px ${FONT}`; ctx.fillStyle = COL.dim; ctx.textAlign = 'right';
  ctx.fillText('Focus follows your eyes', W - 64, 32.5);
  ctx.restore();
}

// ---------- one frame ----------
function draw(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 150, 40, W / 2, 150, 560);
  glow.addColorStop(0, 'rgba(60,90,150,0.16)'); glow.addColorStop(1, 'rgba(60,90,150,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  drawHeader();
  for (const id of ['L', 'R', 'C']) drawScreen(id, t);
  drawCursors(t);
  drawGaze(t);
  const face = drawFace(t);
  drawCaptions(t);
  drawReadout(t, face);

  const fade = Math.max(1 - seg(t, 0, 0.35), seg(t, DURATION - 0.4, DURATION));
  if (fade > 0) { ctx.fillStyle = rgba(COL.bg, fade); ctx.fillRect(0, 0, W, H); }
}
window.draw = draw; window.DURATION = DURATION;

if (params.has('capture')) draw(0);
else {
  const start = performance.now();
  (function loop(now) { draw((now - start) / 1000); requestAnimationFrame(loop); })(start);
}
</script>
